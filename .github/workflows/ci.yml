name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-railway.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the deployment-tested subset; heavy ML wheels are optional
          # for the current test scope (health + config).
          pip install -r requirements-railway.txt
          pip install pytest pytest-asyncio httpx
      - name: Compile check
        run: python -m compileall -q app database
      - name: Tests
        env:
          APP_ENV: testing
          JWT_SECRET_KEY: ci-only-secret
          MONGODB_URL: mongodb://localhost:27017
          MONGODB_DATABASE: lectureweave_test
          CORS_ALLOWED_ORIGINS: http://localhost:3000
        run: pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
