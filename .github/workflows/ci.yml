name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history lets gitleaks flag secrets in prior commits too.
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Leaving GITLEAKS_LICENSE unset is intentional — the free personal
          # scope is enough for our repo size. Add GITLEAKS_LICENSE later if
          # organisation-scale coverage is required.

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Light dependency set: the heavy ML/PDF wheels (torch, faster-whisper,
          # weasyprint, faiss) are lazy/guarded imports and are not needed to
          # import the app or run the unit tests. Keeps CI fast and reliable.
          pip install -r requirements-ci.txt
      - name: Compile check
        run: python -m compileall -q app database
      - name: Tests
        env:
          APP_ENV: testing
          JWT_SECRET_KEY: ci-only-secret
          MONGODB_URL: mongodb://localhost:27017
          MONGODB_DATABASE: lectureweave_test
          CORS_ALLOWED_ORIGINS: http://localhost:3000
        run: pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
