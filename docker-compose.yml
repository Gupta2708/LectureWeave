# Local development stack.
#
# Brings up MongoDB and the LectureWeave backend. The frontend runs separately
# with `npm run dev` because it needs the Vite hot-reload workflow.
#
# Copy backend/.env.example to backend/.env and set GROQ_API_KEY and
# JWT_SECRET_KEY before starting.

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      MONGODB_DATABASE: lectureweave
      HOST: 0.0.0.0
      PORT: 8000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      # Persist HuggingFace model downloads (Whisper + Sentence Transformers) in
      # a named volume so they are fetched once, not on every container start.
      HF_HOME: /models/hf
      SENTENCE_TRANSFORMERS_HOME: /models/st
    # Dev workflow: mount the source and run Uvicorn with --reload so code
    # changes take effect without rebuilding the image. `/app/storage` and the
    # model cache stay on their own volumes so the bind mount doesn't shadow
    # them.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    volumes:
      # Source bind-mount also provides /app/storage on the host, so uploaded
      # files and audio chunks are visible for debugging.
      - ./backend:/app
      - model-cache:/models

volumes:
  mongo-data:
  model-cache:
